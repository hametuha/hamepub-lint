name: Notify failure

# 自動で動く workflow が失敗したら Issue を作り、メンションで通知する。
# 人が作った PR の Test 失敗は本人が見ているので対象外。
on:
  workflow_run:
    workflows: [Test, Deploy, ePubCheck update]
    types: [completed]

permissions:
  issues: write

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'failure' && (
        github.event.workflow_run.name != 'Test' ||
        github.event.workflow_run.actor.login == 'dependabot[bot]' ||
        github.event.workflow_run.actor.login == 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Create or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          title="自動更新が失敗しました"
          body="@fumikito ${NAME} が失敗しました（branch: ${BRANCH}、actor: ${ACTOR}）
          ${RUN_URL}"
          number=$(gh issue list --state open --search "in:title ${title}" --json number --jq '.[0].number')
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
