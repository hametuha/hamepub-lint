name: Deploy

on:
  push:
    branches:
      - master
  # 自動マージ（GITHUB_TOKEN）による push では workflow が起動しないので、毎日拾う。
  # 本番が master の最新と同じなら何もしない。
  schedule:
    - cron: '0 18 * * *' # 毎日 03:00 JST
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDSDK_CORE_PROJECT: hamepub
  REGION: asia-northeast1
  SERVICE: hamepub-lint
  IMAGE: asia-northeast1-docker.pkg.dev/hamepub/hamepub-lint/app:${{ github.sha }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: google-github-actions/auth@v3
        if: github.event_name == 'schedule'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        if: github.event_name == 'schedule'

      - name: Compare deployed image with master
        id: diff
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deployed=$(gcloud run services describe "${SERVICE}" --region="${REGION}" --format='value(spec.template.spec.containers[0].image)')
          echo "deployed=${deployed}"
          echo "master=${IMAGE}"
          if [ "${deployed}" = "${IMAGE}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lint.hametuha.pub
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --target prod -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Deploy to Cloud Run
        run: |
          # shellcheck disable=SC2016 # envsubst に渡す変数名なので展開させない
          envsubst '${IMAGE}' < infra/service.yaml > "${RUNNER_TEMP}/service.yaml"
          gcloud run services replace "${RUNNER_TEMP}/service.yaml" --region="${REGION}"

      - name: Smoke test
        run: |
          url=$(gcloud run services describe "${SERVICE}" --region="${REGION}" --format='value(status.url)')
          curl -fsS "${url}/monitor"
          curl -fsS "${url}/" | grep -q 'Latest('
