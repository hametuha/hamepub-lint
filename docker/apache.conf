<VirtualHost *:${PORT}>
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Cloud Run collects stdout/stderr.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
